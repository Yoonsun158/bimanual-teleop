[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bimanual-teleop"
version = "0.1.0"
description = "Modular Quest, Wuji Glove, Tianji, and Hand2 teleoperation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
visualization = ["matplotlib>=3.10,<4", "numpy>=1.23"]
validation = ["scipy>=1.10,<2"]
wuji = ["wuji-sdk==2026.8.31", "numpy>=1.23,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bimanual_teleop*"]

[tool.setuptools.package-data]
bimanual_teleop = ["py.typed"]
