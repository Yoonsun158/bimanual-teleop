plugins {
    id 'com.android.application' version '8.1.4'
}

android {
    namespace 'org.bimanual.questcapture'
    compileSdk 32
    buildToolsVersion '33.0.1'
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'org.bimanual.questcapture'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                targets 'questcapture'
                arguments '-DANDROID_STL=c++_shared'
                if (project.hasProperty('metaSdkSource')) {
                    arguments "-DFETCHCONTENT_SOURCE_DIR_META_OPENXR_SDK=${file(project.property('metaSdkSource')).absolutePath}"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.53'
}
